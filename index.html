<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Онлайн-заказ — Ресторан</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf7f2;--card:#ffffff;--line:#ebe3d6;
  --text:#2b2118;--muted:#8a7d6b;--accent:#c2410c;--accent2:#ea580c;
  --green:#16a34a;--red:#dc2626;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;font-size:16px;padding-bottom:100px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.spacer{flex:1}
.conn{font-size:12px;font-weight:600;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:20px}
.hero{padding:24px 0 8px}
.hero h1{font-size:32px;font-weight:800;letter-spacing:-.8px;margin-bottom:6px}
.hero p{color:var(--muted);font-size:15px}
@media(max-width:600px){.hero h1{font-size:24px}}

.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.18s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.06);border-color:#d9cdb9}
.card-img{height:120px;background:linear-gradient(135deg,#f5e9d6,#ecd9bd);display:flex;align-items:center;justify-content:center;font-size:44px}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-name{font-weight:700;font-size:16px;line-height:1.3}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.card-price{font-weight:800;color:var(--accent);font-size:17px}
.card-add{background:var(--accent);border:none;color:#fff;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;transition:.15s}
.card-add:hover{background:var(--accent2)}
.card-add:active{transform:scale(.96)}
.empty{color:var(--muted);text-align:center;padding:60px 20px;border:2px dashed var(--line);border-radius:16px;grid-column:1/-1}

.fab{position:fixed;left:20px;right:20px;bottom:20px;background:var(--accent);color:#fff;border:none;border-radius:16px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px;box-shadow:0 8px 30px rgba(194,65,12,.4);cursor:pointer;z-index:60;transition:.2s;font-family:inherit}
.fab:hover{background:var(--accent2)}
.fab.hidden{transform:translateY(120%);opacity:0;pointer-events:none}
.fab .fab-l{display:flex;align-items:center;gap:10px}
.fab .badge{background:rgba(255,255,255,.25);border-radius:10px;padding:3px 10px;font-size:14px}

.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:600px){.modal{align-items:center;padding:20px}}
.modal.hidden{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(20,15,10,.5);backdrop-filter:blur(3px)}
.modal-body{position:relative;background:var(--card);border-radius:20px 20px 0 0;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;animation:slideUp .25s}
@media(min-width:600px){.modal-body{border-radius:20px}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;margin-bottom:16px}
.modal-title{font-size:20px;font-weight:800}
.modal-close{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px}
.modal-close:hover{background:var(--bg);color:var(--text)}

.cart-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;max-height:50vh;overflow:auto}
.cart-row{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:12px 14px}
.cart-name{flex:1;font-weight:600;font-size:15px}
.cart-price{font-weight:700;color:var(--accent);min-width:70px;text-align:right}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;line-height:1}
.qty button:hover{border-color:var(--accent);color:var(--accent)}
.qty span{min-width:22px;text-align:center;font-weight:700}
.cart-empty{color:var(--muted);text-align:center;padding:30px 0}
.cart-total{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px dashed var(--line);margin-bottom:16px;font-size:17px}
.cart-total b{font-size:24px;color:var(--accent);font-weight:800}
.btn{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;transition:.15s;font-family:inherit}
.btn:hover{border-color:#c9bda7}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.block{width:100%;padding:16px;font-size:16px}
.note-text{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}

.success{text-align:center;padding:20px 0 10px}
.success .check{font-size:64px;line-height:1;margin-bottom:8px}
.success h2{font-size:24px;font-weight:800;margin-bottom:8px}
.success .num{font-size:44px;font-weight:900;color:var(--accent);margin:10px 0;letter-spacing:-1px}
.success .sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:20px}
.success .sum{display:inline-block;background:var(--bg);border-radius:12px;padding:10px 18px;font-weight:700;font-size:16px;margin-bottom:20px}

#toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;z-index:300;width:calc(100% - 40px);max-width:400px}
.toast{background:var(--card);border:1px solid var(--accent);color:var(--text);padding:14px 18px;border-radius:12px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.12);animation:slideDown .3s;text-align:center}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>

<header>
  <div class="brand">🍽 Ресторан<small>онлайн-заказ · оплата при получении</small></div>
  <div class="spacer"></div>
  <span class="conn" id="connStatus">● Подключение…</span>
</header>

<main>
  <div class="hero">
    <h1>Меню</h1>
    <p>Выберите блюда — оплата при получении в ресторане</p>
  </div>
  <div id="menu" class="menu"></div>
</main>

<button id="fab" class="fab hidden" onclick="openCart()">
  <span class="fab-l">🛒 <span class="badge" id="fabCount">0</span></span>
  <span id="fabTotal">0 ₽</span>
</button>

<!-- МОДАЛКА КОРЗИНЫ -->
<div id="cart-modal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeCart()"></div>
  <div class="modal-body">
    <div class="modal-head">
      <div class="modal-title">Ваш заказ</div>
      <button class="modal-close" onclick="closeCart()">×</button>
    </div>
    <div id="cartList" class="cart-list"></div>
    <div class="cart-total"><span>Итого</span><b id="cartTotal">0 ₽</b></div>
    <button class="btn primary block" onclick="placeOrder()">Оформить заказ</button>
    <div class="note-text">Оплата наличными или картой при получении</div>
  </div>
</div>

<!-- МОДАЛКА УСПЕХА -->
<div id="success-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-body">
    <div class="success">
      <div class="check">✅</div>
      <h2>Заказ принят!</h2>
      <div>Ваш номер заказа</div>
      <div class="num" id="successNum">№0</div>
      <div class="sub">
        Оплата при получении в ресторане.<br>
        Назовите номер на кассе — мы уже готовим.
      </div>
      <div class="sum" id="successSum">0 ₽</div>
      <button class="btn primary block" onclick="closeSuccess()">Отлично</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, onValue, set, push, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ============== FIREBASE ============== */
const firebaseConfig = {
  apiKey: "AIzaSyBlZ5ZtyTXgtXxSJAx1jOxwhTrzlHRJmo",
  authDomain: "bk-cashier.firebaseapp.com",
  databaseURL: "https://bk-cashier-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bk-cashier",
  storageBucket: "bk-cashier.firebasestorage.app",
  messagingSenderId: "385000840969",
  appId: "1:385000840969:web:1ec8d09176b6551dc0fdd8"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* ============== УТИЛИТЫ ============== */
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ru-RU') + ' ₽';
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(text){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.4s'; setTimeout(()=>el.remove(),400); }, 3500);
}

/* ============== ПОДКЛЮЧЕНИЕ ============== */
onValue(ref(db, '.info/connected'), snap => {
  const online = snap.val();
  const el = $('connStatus');
  el.textContent = online ? '● Онлайн' : '● Оффлайн';
  el.style.color = online ? 'var(--green)' : 'var(--red)';
});

/* ============== СОСТОЯНИЕ ============== */
let products = {};
let cart = [];

/* ============== СЛУШАТЕЛЬ МЕНЮ ============== */
onValue(ref(db, 'products'), snap => {
  products = snap.val() || {};
  renderMenu();
  // Убираем из корзины удалённые товары
  cart = cart.filter(i => products[i.productKey]);
  renderCart();
});

/* ============== МЕНЮ ============== */
const EMOJI_MAP = {
  'Эспрессо':'☕','Капучино':'☕','Чай':'🍵','Круассан':'🥐',
  'Сэндвич':'🥪','Пицца Маргарита':'🍕','Салат Цезарь':'🥗',
  'Чизкейк':'🍰','Вода 0.5':'💧','Лимонад':'🥤'
};
function iconFor(name){
  return EMOJI_MAP[name] || '🍽';
}

function renderMenu(){
  const entries = Object.entries(products);
  const box = $('menu');
  if(!entries.length){
    box.innerHTML = '<div class="empty">Меню пока пустое. Загляните позже!</div>';
    return;
  }
  box.innerHTML = entries.map(([key, p]) => `
    <div class="card">
      <div class="card-img">${iconFor(p.name)}</div>
      <div class="card-body">
        <div class="card-name">${esc(p.name)}</div>
        <div class="card-foot">
          <div class="card-price">${fmt(p.price)}</div>
          <button class="card-add" onclick="addToCart('${key}')">В корзину</button>
        </div>
      </div>
    </div>
  `).join('');
}

/* ============== КОРЗИНА ============== */
function addToCart(key){
  const p = products[key];
  if(!p) return;
  const ex = cart.find(i => i.productKey === key);
  if(ex) ex.qty++;
  else cart.push({productKey:key, name:p.name, price:p.price, qty:1});
  renderCart();
  toast(`«${p.name}» добавлен в корзину`);
}

function changeQty(idx, delta){
  cart[idx].qty += delta;
  if(cart[idx].qty <= 0) cart.splice(idx,1);
  renderCart();
}

function removeItem(idx){
  cart.splice(idx,1);
  renderCart();
}

function cartTotal(){ return cart.reduce((s,i)=>s + i.price*i.qty, 0); }
function cartCount(){ return cart.reduce((s,i)=>s + i.qty, 0); }

function renderCart(){
  const count = cartCount();
  const total = cartTotal();

  const fab = $('fab');
  if(count > 0){
    fab.classList.remove('hidden');
    $('fabCount').textContent = count;
    $('fabTotal').textContent = fmt(total);
  } else {
    fab.classList.add('hidden');
  }

  const list = $('cartList');
  if(!cart.length){
    list.innerHTML = '<div class="cart-empty">Корзина пуста</div>';
    $('cartTotal').textContent = '0 ₽';
    return;
  }
  list.innerHTML = cart.map((i, idx) => `
    <div class="cart-row">
      <span class="cart-name">${esc(i.name)}</span>
      <div class="qty">
        <button onclick="changeQty(${idx},-1)">−</button>
        <span>${i.qty}</span>
        <button onclick="changeQty(${idx},1)">+</button>
      </div>
      <span class="cart-price">${fmt(i.price*i.qty)}</span>
    </div>
  `).join('');
  $('cartTotal').textContent = fmt(total);
}

/* ============== МОДАЛКИ ============== */
function openCart(){
  if(!cart.length) return;
  $('cart-modal').classList.remove('hidden');
}
function closeCart(){ $('cart-modal').classList.add('hidden'); }
function closeSuccess(){ $('success-modal').classList.add('hidden'); }

/* ============== ОФОРМЛЕНИЕ ============== */
async function placeOrder(){
  if(!cart.length) return;
  const items = cart.map(i => ({name:i.name, price:i.price, qty:i.qty}));
  const total = cartTotal();

  try {
    const txn = await runTransaction(ref(db, 'settings/nextOrderId'), cur => (cur || 0) + 1);
    const num = txn.snapshot.val();

    const orderRef = push(ref(db, 'orders'));
    await set(orderRef, {
      num, items, total,
      source: 'online',
      paid: false,
      ready: false,
      issued: false,
      kitchenDone: false,
      createdAt: Date.now()
    });

    $('successNum').textContent = `№${num}`;
    $('successSum').textContent = fmt(total);
    closeCart();
    $('success-modal').classList.remove('hidden');

    cart = [];
    renderCart();
  } catch(e){
    toast('Ошибка оформления: ' + e.message);
  }
}

/* ============== ЭКСПОРТ ============== */
Object.assign(window, {
  addToCart, changeQty, removeItem,
  openCart, closeCart, closeSuccess, placeOrder
});
</script>
</body>
</html>

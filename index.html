<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Репетитор - Видеозвонок</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #0a111f;
            padding: 20px;
        }
        /* Вход */
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #1a2a3a;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }
        .login-box h2 { color: white; margin-bottom: 20px; }
        .role-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role-btn {
            flex: 1;
            padding: 12px;
            background: #2a3a4a;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        .role-btn.active { background: #1f6e8c; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #2a3a4a;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2b6e9e;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }
        .error { color: #ff8888; margin-top: 10px; }
        
        /* Комната */
        .room-box { display: none; max-width: 1400px; margin: 0 auto; }
        .videos {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .video-container {
            flex: 1;
            min-width: 300px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
        }
        .video-container h3 {
            background: #1a2a3a;
            padding: 10px;
            color: white;
            text-align: center;
        }
        .video-wrapper {
            position: relative;
            aspect-ratio: 16/9;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .placeholder {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #666;
        }
        .screen-box {
            margin-top: 20px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            display: none;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-cam { background: #1f6e8c; }
        .btn-mic { background: #1f6e8c; }
        .btn-screen { background: #2a7f6e; }
        .btn-stop { background: #b86b2c; }
        .info {
            background: #1a2a3a;
            padding: 12px;
            border-radius: 16px;
            color: #ccc;
            text-align: center;
            margin-top: 15px;
        }
        .link-box {
            background: #1a2a3a;
            padding: 12px;
            border-radius: 16px;
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .link-input {
            flex: 1;
            background: #2a3a4a;
            border: none;
            padding: 10px;
            border-radius: 30px;
            color: white;
        }
        .copy-btn { background: #2c5a6e; padding: 10px 20px; }
    </style>
</head>
<body>

<!-- Вход -->
<div id="loginPage">
    <div class="login-box">
        <h2>📚 Репетитор</h2>
        <div class="role-buttons">
            <button id="teacherRole" class="role-btn active">👨‍🏫 Учитель</button>
            <button id="studentRole" class="role-btn">👩‍🎓 Ученик</button>
        </div>
        <input type="text" id="login" placeholder="Логин">
        <input type="password" id="password" placeholder="Пароль">
        <button id="enterBtn" class="login-btn">Войти</button>
        <div id="errorMsg" class="error"></div>
    </div>
</div>

<!-- Комната -->
<div id="roomPage" class="room-box">
    <div class="videos">
        <div class="video-container">
            <h3>📷 Вы</h3>
            <div class="video-wrapper">
                <video id="myVideo" autoplay playsinline muted></video>
                <div id="myPlaceholder" class="placeholder">Камера выключена</div>
            </div>
        </div>
        <div class="video-container">
            <h3>👥 Собеседник</h3>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div id="remotePlaceholder" class="placeholder">Ожидание...</div>
            </div>
        </div>
    </div>
    
    <div id="screenBox" class="screen-box">
        <h3 style="padding:10px; background:#1a2a3a;">🖥️ Экран учителя</h3>
        <div class="video-wrapper">
            <video id="screenVideo" autoplay playsinline></video>
            <div id="screenPlaceholder" class="placeholder">Экран не транслируется</div>
        </div>
    </div>
    
    <div class="controls">
        <button id="camBtn" class="btn-cam">📷 Выкл камеру</button>
        <button id="micBtn" class="btn-mic">🎤 Выкл микрофон</button>
        <button id="startScreenBtn" class="btn-screen">🖥️ Включить экран</button>
        <button id="stopScreenBtn" class="btn-stop" disabled>🛑 Остановить</button>
    </div>
    
    <div id="info" class="info">💡 Войдите в систему</div>
    
    <div class="link-box">
        <input id="roomLink" class="link-input" readonly placeholder="Ссылка">
        <button id="copyLink" class="copy-btn">📋 Копировать</button>
    </div>
</div>

<script>
    // Данные учителя
    const TEACHER_LOGIN = "2347";
    const TEACHER_PASS = "2203";
    
    let myRole = null;
    let roomId = null;
    let localStream = null;
    let screenStream = null;
    let peer = null;
    let currentCall = null;
    let screenCall = null;
    let cameraOn = true;
    let micOn = true;
    let screenOn = false;
    
    // DOM элементы
    const loginPage = document.getElementById('loginPage');
    const roomPage = document.getElementById('roomPage');
    const myVideo = document.getElementById('myVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const screenVideo = document.getElementById('screenVideo');
    const myPlaceholder = document.getElementById('myPlaceholder');
    const remotePlaceholder = document.getElementById('remotePlaceholder');
    const screenPlaceholder = document.getElementById('screenPlaceholder');
    const screenBox = document.getElementById('screenBox');
    const infoDiv = document.getElementById('info');
    const roomLink = document.getElementById('roomLink');
    
    // Кнопки
    const teacherRoleBtn = document.getElementById('teacherRole');
    const studentRoleBtn = document.getElementById('studentRole');
    const enterBtn = document.getElementById('enterBtn');
    const camBtn = document.getElementById('camBtn');
    const micBtn = document.getElementById('micBtn');
    const startScreenBtn = document.getElementById('startScreenBtn');
    const stopScreenBtn = document.getElementById('stopScreenBtn');
    const copyLinkBtn = document.getElementById('copyLink');
    const loginInput = document.getElementById('login');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    
    let currentRole = 'teacher';
    
    // Переключение ролей
    teacherRoleBtn.onclick = () => {
        currentRole = 'teacher';
        teacherRoleBtn.classList.add('active');
        studentRoleBtn.classList.remove('active');
        loginInput.placeholder = "Логин";
        passwordInput.placeholder = "Пароль";
        errorMsg.innerText = "";
    };
    
    studentRoleBtn.onclick = () => {
        currentRole = 'student';
        studentRoleBtn.classList.add('active');
        teacherRoleBtn.classList.remove('active');
        loginInput.placeholder = "Ваше имя";
        passwordInput.placeholder = "Любой пароль";
        errorMsg.innerText = "";
    };
    
    // Вход
    enterBtn.onclick = async () => {
        const login = loginInput.value.trim();
        const password = passwordInput.value.trim();
        
        if (currentRole === 'teacher') {
            if (login === TEACHER_LOGIN && password === TEACHER_PASS) {
                myRole = 'teacher';
                await start();
            } else {
                errorMsg.innerText = "Неверный логин или пароль";
            }
        } else {
            if (login && password) {
                myRole = 'student';
                await start();
            } else {
                errorMsg.innerText = "Введите логин и пароль";
            }
        }
    };
    
    async function start() {
        console.log("Старт, роль:", myRole);
        loginPage.style.display = 'none';
        roomPage.style.display = 'block';
        
        // Запрашиваем камеру
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStream = stream;
            myVideo.srcObject = stream;
            myPlaceholder.style.display = 'none';
            console.log("Камера работает");
            infoDiv.innerHTML = "✅ Камера и микрофон готовы";
        } catch (err) {
            console.error("Ошибка камеры:", err);
            infoDiv.innerHTML = "❌ Нет доступа к камере: " + err.message;
        }
        
        if (myRole === 'teacher') {
            // Учитель создаёт комнату
            roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            const url = new URL(window.location.href);
            url.searchParams.set('room', roomId);
            window.history.pushState({}, '', url);
            roomLink.value = window.location.href;
            infoDiv.innerHTML = `✅ Комната ${roomId} создана! Жду ученика...`;
            
            // Создаём Peer
            peer = new Peer(roomId);
            peer.on('open', () => {
                console.log("Peer учителя открыт:", peer.id);
            });
            peer.on('call', (call) => {
                console.log("Звонок от ученика!");
                if (call.metadata?.type === 'screen') {
                    // Экран
                    call.answer();
                    call.on('stream', (stream) => {
                        screenVideo.srcObject = stream;
                        screenBox.style.display = 'block';
                        screenPlaceholder.style.display = 'none';
                        infoDiv.innerHTML = "🖥️ Учитель показывает экран";
                    });
                    screenCall = call;
                } else {
                    // Видео
                    if (localStream) {
                        call.answer(localStream);
                        call.on('stream', (stream) => {
                            remoteVideo.srcObject = stream;
                            remotePlaceholder.style.display = 'none';
                            infoDiv.innerHTML = "✅ Ученик подключился!";
                        });
                        currentCall = call;
                    }
                }
            });
            peer.on('error', (err) => console.log("Peer error:", err));
        } else {
            // Ученик
            const params = new URLSearchParams(window.location.search);
            let invRoom = params.get('room');
            if (!invRoom) {
                invRoom = prompt("Введите ID комнаты от учителя:");
                if (!invRoom) { location.reload(); return; }
                const newUrl = `${window.location.origin}${window.location.pathname}?room=${invRoom}`;
                window.history.pushState({}, '', newUrl);
                roomLink.value = newUrl;
            } else {
                roomLink.value = window.location.href;
            }
            roomId = invRoom;
            infoDiv.innerHTML = `🔗 Подключение к ${roomId}...`;
            
            // Создаём Peer
            const studentId = 's_' + Math.random().toString(36).substring(2, 10);
            peer = new Peer(studentId);
            peer.on('open', () => {
                console.log("Peer ученика открыт:", peer.id);
                // Звоним учителю
                if (localStream) {
                    const call = peer.call(roomId, localStream);
                    call.on('stream', (stream) => {
                        remoteVideo.srcObject = stream;
                        remotePlaceholder.style.display = 'none';
                        infoDiv.innerHTML = "✅ Подключено к учителю!";
                    });
                    currentCall = call;
                }
            });
            
            // Слушаем экран от учителя
            peer.on('call', (call) => {
                if (call.metadata?.type === 'screen') {
                    call.answer();
                    call.on('stream', (stream) => {
                        screenVideo.srcObject = stream;
                        screenBox.style.display = 'block';
                        screenPlaceholder.style.display = 'none';
                        // Если экран включён, скрываем своё видео (ученик видит учителя на весь экран)
                        const localCard = document.querySelector('.video-container:first-child');
                        const remoteCard = document.querySelector('.video-container:last-child');
                        remoteCard.style.flex = '1 1 100%';
                        localCard.style.display = 'none';
                    });
                    screenCall = call;
                }
            });
            peer.on('error', (err) => console.log("Peer error:", err));
        }
    }
    
    // Управление камерой
    camBtn.onclick = () => {
        if (localStream) {
            cameraOn = !cameraOn;
            localStream.getVideoTracks()[0].enabled = cameraOn;
            myPlaceholder.style.display = cameraOn ? 'none' : 'flex';
            camBtn.innerHTML = cameraOn ? '📷 Выкл камеру' : '📷 Вкл камеру';
        }
    };
    
    // Управление микрофоном
    micBtn.onclick = () => {
        if (localStream) {
            micOn = !micOn;
            localStream.getAudioTracks()[0].enabled = micOn;
            micBtn.innerHTML = micOn ? '🎤 Выкл микрофон' : '🎤 Вкл микрофон';
        }
    };
    
    // Включить экран (только учитель)
    startScreenBtn.onclick = async () => {
        if (myRole !== 'teacher') {
            infoDiv.innerHTML = "⚠️ Только учитель может показывать экран";
            return;
        }
        if (!currentCall) {
            infoDiv.innerHTML = "⚠️ Сначала дождитесь ученика";
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            screenStream = stream;
            screenOn = true;
            
            const call = peer.call(currentCall.peer, stream, { metadata: { type: 'screen' } });
            screenCall = call;
            
            screenVideo.srcObject = stream;
            screenBox.style.display = 'block';
            screenPlaceholder.style.display = 'none';
            startScreenBtn.disabled = true;
            stopScreenBtn.disabled = false;
            infoDiv.innerHTML = "🖥️ Демонстрация экрана";
            
            stream.getVideoTracks()[0].onended = () => stopScreen();
        } catch(err) {
            infoDiv.innerHTML = "Ошибка: " + err.message;
        }
    };
    
    function stopScreen() {
        if (screenStream) {
            screenStream.getTracks().forEach(t => t.stop());
            screenStream = null;
        }
        if (screenCall) screenCall.close();
        screenOn = false;
        screenBox.style.display = 'none';
        screenVideo.srcObject = null;
        startScreenBtn.disabled = false;
        stopScreenBtn.disabled = true;
        
        // Восстанавливаем нормальный вид
        const localCard = document.querySelector('.video-container:first-child');
        const remoteCard = document.querySelector('.video-container:last-child');
        remoteCard.style.flex = '1';
        localCard.style.display = 'flex';
        infoDiv.innerHTML = "🛑 Демонстрация экрана остановлена";
    }
    
    stopScreenBtn.onclick = stopScreen;
    
    // Копировать ссылку
    copyLinkBtn.onclick = () => {
        roomLink.select();
        document.execCommand('copy');
        infoDiv.innerHTML = "📋 Ссылка скопирована!";
        setTimeout(() => {
            infoDiv.innerHTML = "💡 Отправьте ссылку ученику";
        }, 2000);
    };
    
    // Очистка
    window.onbeforeunload = () => {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        if (peer) peer.destroy();
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Репетитор - Видеосвязь</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1a2b, #0a111f);
            padding: 20px;
        }

        /* Вход */
        .login-container {
            max-width: 450px;
            margin: 100px auto;
            background: rgba(19, 33, 46, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 35px;
            border: 1px solid #2c6e8f;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .login-container h2 {
            color: #e2f0ff;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .role-switch {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .role-btn {
            flex: 1;
            padding: 12px;
            background: #0e1f2c;
            border: none;
            border-radius: 40px;
            color: #a0c4e0;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .role-btn.active {
            background: #1f6e8c;
            color: white;
        }

        .login-input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #0e1f2c;
            border: 1px solid #2f6080;
            border-radius: 40px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #2b6e9e;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        .login-btn:hover { background: #3a8bb8; }

        .error-msg {
            color: #ffb4a2;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        /* Комната */
        .room-container {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
        }

        .video-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-card {
            flex: 1;
            min-width: 300px;
            background: #07131e;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #2c6e8f;
        }

        .video-header {
            background: #0a1a28;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            color: #d4edff;
            font-weight: bold;
        }

        .video-wrapper {
            position: relative;
            aspect-ratio: 16/9;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1a24;
            color: #7c9eb3;
            font-size: 18px;
        }

        .screen-area {
            margin-top: 20px;
            background: #00000066;
            border-radius: 24px;
            border: 1px solid #3c6e8f;
            overflow: hidden;
            display: none;
        }

        .screen-area .video-wrapper {
            aspect-ratio: 16/9;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            padding: 15px;
            background: #0e1c28cc;
            border-radius: 60px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }

        .btn-cam { background: #1f6e8c; }
        .btn-mic { background: #1f6e8c; }
        .btn-screen { background: #2a7f6e; }
        .btn-stop { background: #b86b2c; }

        .info {
            background: #0f1f2a;
            border-radius: 20px;
            padding: 12px 20px;
            color: #c7e2f5;
            text-align: center;
            margin-top: 15px;
        }

        .link-box {
            background: #07131c;
            border-radius: 48px;
            padding: 12px 18px;
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .link-input {
            flex: 1;
            background: #1c2e3c;
            border: none;
            padding: 10px;
            border-radius: 40px;
            color: white;
        }

        .copy-btn {
            background: #2c5a6e;
            padding: 10px 20px;
            border: none;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .connected { background: #2e7d5e; }
        .waiting { background: #8b6b2c; }

        @media (max-width: 700px) {
            .video-grid { flex-direction: column; }
        }
    </style>
</head>
<body>

<div id="loginScreen" class="login-container">
    <h2>📚 Репетитор</h2>
    <div class="role-switch">
        <button class="role-btn active" id="teacherRoleBtn">👨‍🏫 Учитель</button>
        <button class="role-btn" id="studentRoleBtn">👩‍🎓 Ученик</button>
    </div>
    <input type="text" id="login" class="login-input" placeholder="Логин">
    <input type="password" id="password" class="login-input" placeholder="Пароль">
    <button id="enterBtn" class="login-btn">Войти</button>
    <div id="loginError" class="error-msg"></div>
</div>

<div id="roomScreen" class="room-container">
    <div class="video-grid">
        <div class="video-card">
            <div class="video-header">
                <span>📷 Вы</span>
                <span id="myStatus" class="status-badge waiting">⏳</span>
            </div>
            <div class="video-wrapper">
                <video id="myVideo" autoplay playsinline muted></video>
                <div id="myPlaceholder" class="placeholder">🎥 Камера выключена</div>
            </div>
        </div>
        <div class="video-card">
            <div class="video-header">
                <span>👥 Собеседник</span>
                <span id="remoteStatus" class="status-badge waiting">⏳ Ожидание</span>
            </div>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div id="remotePlaceholder" class="placeholder">🕒 Ожидание подключения...</div>
            </div>
        </div>
    </div>

    <div id="screenContainer" class="screen-area">
        <div class="video-header">🖥️ Демонстрация экрана</div>
        <div class="video-wrapper">
            <video id="screenVideo" autoplay playsinline></video>
            <div id="screenPlaceholder" class="placeholder">📺 Экран не транслируется</div>
        </div>
    </div>

    <div class="controls">
        <button id="toggleCamBtn" class="btn btn-cam">📷 Выкл камеру</button>
        <button id="toggleMicBtn" class="btn btn-mic">🎤 Выкл микрофон</button>
        <button id="startScreenBtn" class="btn btn-screen">🖥️ Включить экран</button>
        <button id="stopScreenBtn" class="btn btn-stop" disabled>🛑 Остановить экран</button>
    </div>

    <div class="info" id="infoMsg">
        💡 Создайте комнату и отправьте ссылку ученику
    </div>

    <div class="link-box">
        <input type="text" id="roomLink" class="link-input" readonly>
        <button id="copyLinkBtn" class="copy-btn">📋 Копировать</button>
    </div>
</div>

<script>
    // ============ ДАННЫЕ УЧИТЕЛЯ (СКРЫТЫ) ============
    const TEACHER_LOGIN = "2347";
    const TEACHER_PASS = "2203";
    
    // ============ ПЕРЕМЕННЫЕ ============
    let myRole = null;           // 'teacher' или 'student'
    let roomId = null;
    let localStream = null;
    let screenStream = null;
    let peerConnection = null;
    let isCameraOn = true;
    let isMicOn = true;
    let isScreenSharing = false;
    
    // DOM элементы
    const loginScreen = document.getElementById('loginScreen');
    const roomScreen = document.getElementById('roomScreen');
    const myVideo = document.getElementById('myVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const screenVideo = document.getElementById('screenVideo');
    const myPlaceholder = document.getElementById('myPlaceholder');
    const remotePlaceholder = document.getElementById('remotePlaceholder');
    const screenPlaceholder = document.getElementById('screenPlaceholder');
    const screenContainer = document.getElementById('screenContainer');
    const remoteStatusSpan = document.getElementById('remoteStatus');
    const myStatusSpan = document.getElementById('myStatus');
    const roomLinkInput = document.getElementById('roomLink');
    const infoMsg = document.getElementById('infoMsg');
    
    // Кнопки
    const teacherRoleBtn = document.getElementById('teacherRoleBtn');
    const studentRoleBtn = document.getElementById('studentRoleBtn');
    const enterBtn = document.getElementById('enterBtn');
    const toggleCamBtn = document.getElementById('toggleCamBtn');
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const startScreenBtn = document.getElementById('startScreenBtn');
    const stopScreenBtn = document.getElementById('stopScreenBtn');
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    const loginInput = document.getElementById('login');
    const passwordInput = document.getElementById('password');
    const loginError = document.getElementById('loginError');
    
    let currentRoleSelect = 'teacher';
    
    // Переключение ролей на входе
    teacherRoleBtn.onclick = () => {
        currentRoleSelect = 'teacher';
        teacherRoleBtn.classList.add('active');
        studentRoleBtn.classList.remove('active');
        loginInput.placeholder = "Логин";
        passwordInput.placeholder = "Пароль";
    };
    
    studentRoleBtn.onclick = () => {
        currentRoleSelect = 'student';
        studentRoleBtn.classList.add('active');
        teacherRoleBtn.classList.remove('active');
        loginInput.placeholder = "Ваше имя";
        passwordInput.placeholder = "Любой пароль";
    };
    
    // Вход
    enterBtn.onclick = async () => {
        const login = loginInput.value.trim();
        const password = passwordInput.value.trim();
        
        if (currentRoleSelect === 'teacher') {
            if (login === TEACHER_LOGIN && password === TEACHER_PASS) {
                myRole = 'teacher';
                await initRoom();
            } else {
                loginError.innerText = "❌ Неверный логин или пароль";
            }
        } else {
            if (login && password) {
                myRole = 'student';
                await initRoom();
            } else {
                loginError.innerText = "❌ Введите логин и пароль";
            }
        }
    };
    
    async function initRoom() {
        loginScreen.style.display = 'none';
        roomScreen.style.display = 'block';
        
        // Получаем или создаём ID комнаты
        const urlParams = new URLSearchParams(window.location.search);
        let roomFromUrl = urlParams.get('room');
        
        if (myRole === 'teacher') {
            // Учитель создаёт новую комнату
            roomId = Math.random().toString(36).substring(2, 10).toUpperCase();
            const newUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            window.history.pushState({}, '', newUrl);
            roomLinkInput.value = window.location.href;
            infoMsg.innerHTML = `✅ Комната создана! ID: ${roomId}. Отправьте ссылку ученику.`;
        } else {
            // Ученик подключается к существующей
            if (roomFromUrl) {
                roomId = roomFromUrl;
                roomLinkInput.value = window.location.href;
                infoMsg.innerHTML = `🔗 Подключение к комнате ${roomId}...`;
            } else {
                const inputRoom = prompt("Введите ID комнаты от учителя:");
                if (inputRoom) {
                    roomId = inputRoom.toUpperCase();
                    const newUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
                    window.history.pushState({}, '', newUrl);
                    roomLinkInput.value = window.location.href;
                } else {
                    location.reload();
                    return;
                }
            }
        }
        
        // Запрашиваем доступ к камере и микрофону
        await getMedia();
        
        // Подключаемся к серверу сигналинга
        connectToSignaling();
    }
    
    async function getMedia() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStream = stream;
            myVideo.srcObject = stream;
            myPlaceholder.style.display = 'none';
            isCameraOn = true;
            isMicOn = true;
            updateUI();
        } catch (err) {
            infoMsg.innerHTML = `❌ Ошибка доступа к камере: ${err.message}`;
            myPlaceholder.innerHTML = "⚠️ Нет доступа к камере/микрофону";
        }
    }
    
    function updateUI() {
        if (localStream) {
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) videoTrack.enabled = isCameraOn;
            myPlaceholder.style.display = isCameraOn ? 'none' : 'flex';
            if (!isCameraOn) myPlaceholder.innerHTML = '📷 Камера выключена';
            toggleCamBtn.innerHTML = isCameraOn ? '📷 Выкл камеру' : '📷 Вкл камеру';
            
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) audioTrack.enabled = isMicOn;
            toggleMicBtn.innerHTML = isMicOn ? '🎤 Выкл микрофон' : '🎤 Вкл микрофон';
        }
    }
    
    // ============ СОЗДАНИЕ ПРОСТОГО WebRTC СОЕДИНЕНИЯ ============
    // Используем публичный сервер сигналинга
    let socket = null;
    
    function connectToSignaling() {
        // Публичный WebSocket сервер для сигналинга
        socket = io('https://webrtc-signaling-1.onrender.com', {
            transports: ['websocket'],
            reconnection: true
        });
        
        socket.on('connect', () => {
            console.log('Соединение с сервером установлено');
            infoMsg.innerHTML = `✅ Подключено к серверу. Комната: ${roomId}`;
            
            // Входим в комнату
            socket.emit('join', { roomId, role: myRole });
            
            if (myRole === 'teacher') {
                myStatusSpan.innerHTML = '🎥 Ожидаю ученика';
                myStatusSpan.className = 'status-badge waiting';
            } else {
                myStatusSpan.innerHTML = '🎥 Подключение...';
                myStatusSpan.className = 'status-badge waiting';
            }
        });
        
        socket.on('ready', async (data) => {
            console.log('Готов к соединению:', data);
            await createPeerConnection();
            
            if (myRole === 'teacher') {
                // Учитель создаёт offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('signal', { roomId, signal: offer });
            }
        });
        
        socket.on('signal', async (data) => {
            if (!peerConnection) {
                await createPeerConnection();
            }
            
            if (data.signal.type === 'offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('signal', { roomId, signal: answer });
            } else if (data.signal.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
            } else if (data.signal.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.signal));
            }
        });
        
        socket.on('screen-signal', async (data) => {
            // Обработка сигналов для экрана
            if (myRole === 'student' && data.signal.type === 'offer') {
                if (!screenPeerConnection) {
                    await createScreenPeerConnection();
                }
                await screenPeerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
                const answer = await screenPeerConnection.createAnswer();
                await screenPeerConnection.setLocalDescription(answer);
                socket.emit('screen-signal', { roomId, signal: answer });
            } else if (data.signal.type === 'answer' && screenPeerConnection) {
                await screenPeerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
            } else if (data.signal.candidate && screenPeerConnection) {
                await screenPeerConnection.addIceCandidate(new RTCIceCandidate(data.signal));
            }
        });
        
        socket.on('user-left', () => {
            remoteStatusSpan.innerHTML = '⏳ Собеседник отключился';
            remoteStatusSpan.className = 'status-badge waiting';
            remotePlaceholder.style.display = 'flex';
            if (remoteVideo.srcObject) {
                remoteVideo.srcObject = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
        });
        
        socket.on('disconnect', () => {
            infoMsg.innerHTML = "⚠️ Соединение с сервером потеряно. Перезагрузите страницу.";
        });
    }
    
    let peerConnection = null;
    let screenPeerConnection = null;
    
    async function createPeerConnection() {
        peerConnection = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        });
        
        // Добавляем локальный поток
        if (localStream) {
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
        }
        
        peerConnection.ontrack = (event) => {
            if (event.streams && event.streams[0]) {
                remoteVideo.srcObject = event.streams[0];
                remotePlaceholder.style.display = 'none';
                remoteStatusSpan.innerHTML = '🟢 В сети';
                remoteStatusSpan.className = 'status-badge connected';
                myStatusSpan.innerHTML = '🎥 В сети';
                myStatusSpan.className = 'status-badge connected';
                infoMsg.innerHTML = "✅ Соединение установлено!";
            }
        };
        
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('signal', { roomId, signal: event.candidate });
            }
        };
        
        peerConnection.onconnectionstatechange = () => {
            if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
                remoteStatusSpan.innerHTML = '⏳ Соединение потеряно';
                remoteStatusSpan.className = 'status-badge waiting';
            }
        };
        
        return peerConnection;
    }
    
    async function createScreenPeerConnection() {
        screenPeerConnection = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        });
        
        if (myRole === 'teacher' && screenStream) {
            screenStream.getTracks().forEach(track => {
                screenPeerConnection.addTrack(track, screenStream);
            });
        }
        
        screenPeerConnection.ontrack = (event) => {
            if (event.streams && event.streams[0]) {
                screenVideo.srcObject = event.streams[0];
                screenContainer.style.display = 'block';
                screenPlaceholder.style.display = 'none';
                applyFullscreen(true);
            }
        };
        
        screenPeerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                socket.emit('screen-signal', { roomId, signal: event.candidate });
            }
        };
        
        return screenPeerConnection;
    }
    
    function applyFullscreen(screenActive) {
        const localCard = document.querySelector('.video-card:first-child');
        const remoteCard = document.querySelector('.video-card:last-child');
        
        if (myRole === 'student' && !screenActive && remoteVideo.srcObject) {
            remoteCard.style.flex = '1 1 100%';
            localCard.style.display = 'none';
        } else {
            remoteCard.style.flex = '1';
            localCard.style.display = 'flex';
        }
    }
    
    // Демонстрация экрана (только учитель)
    startScreenBtn.onclick = async () => {
        if (myRole !== 'teacher') {
            infoMsg.innerHTML = "⚠️ Только учитель может демонстрировать экран!";
            return;
        }
        if (!peerConnection || peerConnection.connectionState !== 'connected') {
            infoMsg.innerHTML = "⚠️ Сначала дождитесь подключения ученика";
            return;
        }
        
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            screenStream = stream;
            isScreenSharing = true;
            
            await createScreenPeerConnection();
            
            const offer = await screenPeerConnection.createOffer();
            await screenPeerConnection.setLocalDescription(offer);
            socket.emit('screen-signal', { roomId, signal: offer });
            
            screenContainer.style.display = 'block';
            screenVideo.srcObject = stream;
            screenPlaceholder.style.display = 'none';
            startScreenBtn.disabled = true;
            stopScreenBtn.disabled = false;
            
            stream.getVideoTracks()[0].onended = () => stopScreenShare();
            infoMsg.innerHTML = "🖥️ Демонстрация экрана начата";
        } catch (err) {
            infoMsg.innerHTML = "Ошибка: " + err.message;
        }
    };
    
    function stopScreenShare() {
        if (screenStream) {
            screenStream.getTracks().forEach(t => t.stop());
            screenStream = null;
        }
        if (screenPeerConnection) {
            screenPeerConnection.close();
            screenPeerConnection = null;
        }
        isScreenSharing = false;
        screenContainer.style.display = 'none';
        screenVideo.srcObject = null;
        startScreenBtn.disabled = false;
        stopScreenBtn.disabled = true;
        applyFullscreen(false);
        infoMsg.innerHTML = "🛑 Демонстрация экрана остановлена";
    }
    
    stopScreenBtn.onclick = stopScreenShare;
    
    toggleCamBtn.onclick = () => {
        isCameraOn = !isCameraOn;
        updateUI();
    };
    
    toggleMicBtn.onclick = () => {
        isMicOn = !isMicOn;
        updateUI();
    };
    
    copyLinkBtn.onclick = () => {
        roomLinkInput.select();
        document.execCommand('copy');
        infoMsg.innerHTML = "📋 Ссылка скопирована!";
        setTimeout(() => {
            infoMsg.innerHTML = "💡 Отправьте ссылку ученику для подключения";
        }, 2000);
    };
    
    window.onbeforeunload = () => {
        if (socket) socket.disconnect();
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
    };
</script>
</body>
</html>

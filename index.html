<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Репетитор - Видеозвонок</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0a111f; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .screen { max-width: 500px; width: 100%; background: #1a2a3a; border-radius: 20px; padding: 30px; text-align: center; }
        .room { max-width: 1400px; width: 100%; display: none; }
        
        h2 { color: white; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #0e1f2c; border: none; border-radius: 30px; color: white; font-size: 18px; text-align: center; }
        button { width: 100%; padding: 15px; background: #2b6e9e; border: none; border-radius: 30px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #3a8bb8; }
        .error { color: #ff8888; margin-top: 10px; }
        
        .code-box { background: #0e1f2c; padding: 30px; border-radius: 20px; margin: 20px 0; border: 2px solid #4ade80; }
        .big-code { font-size: 64px; font-weight: bold; color: #4ade80; letter-spacing: 10px; }
        
        .video-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
        .video-card { flex: 1; min-width: 300px; background: #07131e; border-radius: 16px; overflow: hidden; }
        .video-header { background: #0a1a28; padding: 10px; color: white; display: flex; justify-content: space-between; }
        .video-wrapper { position: relative; aspect-ratio: 16/9; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #111; color: #666; }
        .controls { display: flex; gap: 10px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; color: white; }
        .btn-cam { background: #1f6e8c; }
        .btn-mic { background: #1f6e8c; }
        .btn-screen { background: #2a7f6e; }
        .info { background: #0f1f2a; padding: 12px; border-radius: 16px; color: #ccc; text-align: center; margin-top: 15px; }
        .status { padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .online { background: #2e7d5e; }
        .offline { background: #8b6b2c; }
    </style>
</head>
<body>

<!-- ЭКРАН ВЫБОРА -->
<div id="roleScreen" class="screen">
    <h2>📚 Репетитор</h2>
    <button id="teacherBtn" style="background:#1f6e8c">👨‍🏫 Я учитель</button>
    <button id="studentBtn" style="background:#2a7f6e; margin-top:15px">👩‍🎓 Я ученик</button>
</div>

<!-- ВХОД УЧИТЕЛЯ -->
<div id="teacherLogin" class="screen" style="display:none">
    <h2>Вход учителя</h2>
    <input type="text" id="teacherLoginInput" placeholder="Логин">
    <input type="password" id="teacherPassInput" placeholder="Пароль">
    <button id="doLoginBtn">Войти</button>
    <div id="loginError" class="error"></div>
    <button id="backToRoleBtn" style="background:#555">Назад</button>
</div>

<!-- ГЛАВНАЯ УЧИТЕЛЯ -->
<div id="teacherRoom" class="room">
    <div class="screen" style="max-width:500px; margin:0 auto 20px auto">
        <h2>Ваш код</h2>
        <div class="code-box">
            <div class="big-code" id="codeDisplay">-----</div>
        </div>
        <p style="color:#a0c4e0">Скажите этот код ученику</p>
        <button id="newCodeBtn" style="background:#2a7f6e">Новый код</button>
    </div>
    
    <div class="video-grid">
        <div class="video-card">
            <div class="video-header"><span>📷 Вы</span><span id="tMyStatus" class="status offline">Ожидание</span></div>
            <div class="video-wrapper"><video id="tMyVideo" autoplay muted playsinline></video><div id="tMyPlace" class="placeholder">Камера выкл</div></div>
        </div>
        <div class="video-card">
            <div class="video-header"><span>👥 Ученик</span><span id="tRemoteStatus" class="status offline">Не подключён</span></div>
            <div class="video-wrapper"><video id="tRemoteVideo" autoplay playsinline></video><div id="tRemotePlace" class="placeholder">Ожидание...</div></div>
        </div>
    </div>
    
    <div class="controls">
        <button id="tCamBtn" class="btn btn-cam">📷 Выкл камеру</button>
        <button id="tMicBtn" class="btn btn-mic">🎤 Выкл микрофон</button>
        <button id="tScreenBtn" class="btn btn-screen">🖥️ Показать экран</button>
        <button id="tStopScreenBtn" class="btn btn-screen" disabled>🛑 Остановить</button>
    </div>
    <div id="tInfo" class="info">💡 Ожидайте подключения</div>
</div>

<!-- ВВОД КОДА УЧЕНИКОМ -->
<div id="studentCode" class="screen" style="display:none">
    <h2>Введите код учителя</h2>
    <input type="text" id="codeInput" maxlength="5" placeholder="5 цифр">
    <button id="connectBtn">Подключиться</button>
    <div id="codeError" class="error"></div>
    <button id="backFromStudentBtn" style="background:#555">Назад</button>
</div>

<!-- КОМНАТА УЧЕНИКА -->
<div id="studentRoom" class="room">
    <div class="video-grid">
        <div class="video-card">
            <div class="video-header"><span>📷 Вы</span><span id="sMyStatus" class="status offline">Ожидание</span></div>
            <div class="video-wrapper"><video id="sMyVideo" autoplay muted playsinline></video><div id="sMyPlace" class="placeholder">Камера выкл</div></div>
        </div>
        <div class="video-card">
            <div class="video-header"><span>👥 Учитель</span><span id="sRemoteStatus" class="status offline">Не подключён</span></div>
            <div class="video-wrapper"><video id="sRemoteVideo" autoplay playsinline></video><div id="sRemotePlace" class="placeholder">Ожидание...</div></div>
        </div>
    </div>
    <div class="controls">
        <button id="sCamBtn" class="btn btn-cam">📷 Выкл камеру</button>
        <button id="sMicBtn" class="btn btn-mic">🎤 Выкл микрофон</button>
    </div>
    <div id="sInfo" class="info">💡 Подключение...</div>
</div>

<script>
    // УЧИТЕЛЬ (данные скрыты в коде)
    const TEACHER_LOGIN = "2347";
    const TEACHER_PASS = "2203";
    
    let peer = null;
    let call = null;
    let screenCall = null;
    let localStream = null;
    let screenStream = null;
    let currentCode = null;
    let role = null;
    let camOn = true;
    let micOn = true;
    
    // Элементы
    const roleScreen = document.getElementById('roleScreen');
    const teacherLoginDiv = document.getElementById('teacherLogin');
    const teacherRoomDiv = document.getElementById('teacherRoom');
    const studentCodeDiv = document.getElementById('studentCode');
    const studentRoomDiv = document.getElementById('studentRoom');
    
    // Учитель - вход
    document.getElementById('teacherBtn').onclick = () => {
        roleScreen.style.display = 'none';
        teacherLoginDiv.style.display = 'block';
    };
    
    document.getElementById('studentBtn').onclick = () => {
        roleScreen.style.display = 'none';
        studentCodeDiv.style.display = 'block';
    };
    
    document.getElementById('backToRoleBtn').onclick = () => {
        teacherLoginDiv.style.display = 'none';
        roleScreen.style.display = 'block';
    };
    
    document.getElementById('backFromStudentBtn').onclick = () => {
        studentCodeDiv.style.display = 'none';
        roleScreen.style.display = 'block';
    };
    
    // Вход учителя
    document.getElementById('doLoginBtn').onclick = async () => {
        const login = document.getElementById('teacherLoginInput').value;
        const pass = document.getElementById('teacherPassInput').value;
        
        if (login === TEACHER_LOGIN && pass === TEACHER_PASS) {
            teacherLoginDiv.style.display = 'none';
            teacherRoomDiv.style.display = 'block';
            role = 'teacher';
            await startTeacher();
        } else {
            document.getElementById('loginError').innerText = 'Неверный логин или пароль';
        }
    };
    
    async function startTeacher() {
        // Камера
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('tMyVideo').srcObject = localStream;
            document.getElementById('tMyPlace').style.display = 'none';
        } catch(e) {
            document.getElementById('tInfo').innerHTML = '❌ Нет доступа к камере';
        }
        
        newCode();
    }
    
    function newCode() {
        currentCode = Math.floor(10000 + Math.random() * 90000).toString();
        document.getElementById('codeDisplay').innerText = currentCode;
        
        if (peer) {
            if (call) call.close();
            peer.destroy();
        }
        
        peer = new Peer(currentCode);
        
        peer.on('open', () => {
            document.getElementById('tInfo').innerHTML = `✅ Код ${currentCode} активен`;
        });
        
        peer.on('call', (incomingCall) => {
            if (incomingCall.metadata?.type === 'screen') return;
            
            if (localStream) {
                incomingCall.answer(localStream);
                incomingCall.on('stream', (stream) => {
                    document.getElementById('tRemoteVideo').srcObject = stream;
                    document.getElementById('tRemotePlace').style.display = 'none';
                    document.getElementById('tRemoteStatus').innerText = 'В сети';
                    document.getElementById('tRemoteStatus').className = 'status online';
                    document.getElementById('tMyStatus').innerText = 'В сети';
                    document.getElementById('tMyStatus').className = 'status online';
                    document.getElementById('tInfo').innerHTML = '✅ Ученик подключился!';
                });
                incomingCall.on('close', () => {
                    document.getElementById('tRemoteVideo').srcObject = null;
                    document.getElementById('tRemotePlace').style.display = 'flex';
                    document.getElementById('tRemoteStatus').innerText = 'Отключён';
                    document.getElementById('tRemoteStatus').className = 'status offline';
                    document.getElementById('tInfo').innerHTML = '⚠️ Ученик отключился';
                });
                call = incomingCall;
            }
        });
    }
    
    document.getElementById('newCodeBtn').onclick = () => {
        if (call) call.close();
        if (screenCall) screenCall.close();
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        document.getElementById('tScreenBtn').disabled = false;
        document.getElementById('tStopScreenBtn').disabled = true;
        newCode();
    };
    
    // Учитель - камера/микрофон
    document.getElementById('tCamBtn').onclick = () => {
        if (localStream) {
            camOn = !camOn;
            localStream.getVideoTracks()[0].enabled = camOn;
            document.getElementById('tMyPlace').style.display = camOn ? 'none' : 'flex';
            document.getElementById('tCamBtn').innerHTML = camOn ? '📷 Выкл камеру' : '📷 Вкл камеру';
        }
    };
    
    document.getElementById('tMicBtn').onclick = () => {
        if (localStream) {
            micOn = !micOn;
            localStream.getAudioTracks()[0].enabled = micOn;
            document.getElementById('tMicBtn').innerHTML = micOn ? '🎤 Выкл микрофон' : '🎤 Вкл микрофон';
        }
    };
    
    // Экран
    document.getElementById('tScreenBtn').onclick = async () => {
        if (!call) {
            document.getElementById('tInfo').innerHTML = '⚠️ Сначала дождитесь ученика';
            return;
        }
        try {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const scrCall = peer.call(call.peer, screenStream, { metadata: { type: 'screen' } });
            screenCall = scrCall;
            document.getElementById('tScreenBtn').disabled = true;
            document.getElementById('tStopScreenBtn').disabled = false;
            document.getElementById('tInfo').innerHTML = '🖥️ Экран транслируется';
            screenStream.getVideoTracks()[0].onended = () => stopScreen();
        } catch(e) {}
    };
    
    function stopScreen() {
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        if (screenCall) screenCall.close();
        screenStream = null;
        document.getElementById('tScreenBtn').disabled = false;
        document.getElementById('tStopScreenBtn').disabled = true;
        document.getElementById('tInfo').innerHTML = '🛑 Экран остановлен';
    }
    
    document.getElementById('tStopScreenBtn').onclick = stopScreen;
    
    // ============ УЧЕНИК ============
    document.getElementById('connectBtn').onclick = async () => {
        const code = document.getElementById('codeInput').value.trim();
        if (code.length !== 5 || !/^\d+$/.test(code)) {
            document.getElementById('codeError').innerText = 'Введите 5 цифр';
            return;
        }
        
        studentCodeDiv.style.display = 'none';
        studentRoomDiv.style.display = 'block';
        
        // Камера
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('sMyVideo').srcObject = localStream;
            document.getElementById('sMyPlace').style.display = 'none';
        } catch(e) {
            document.getElementById('sInfo').innerHTML = '❌ Нет доступа к камере';
        }
        
        const studentId = 's_' + Math.random().toString(36).substring(2, 10);
        peer = new Peer(studentId);
        
        peer.on('open', () => {
            document.getElementById('sInfo').innerHTML = `🔗 Подключение к коду ${code}...`;
            const outgoingCall = peer.call(code, localStream);
            outgoingCall.on('stream', (stream) => {
                document.getElementById('sRemoteVideo').srcObject = stream;
                document.getElementById('sRemotePlace').style.display = 'none';
                document.getElementById('sRemoteStatus').innerText = 'В сети';
                document.getElementById('sRemoteStatus').className = 'status online';
                document.getElementById('sMyStatus').innerText = 'В сети';
                document.getElementById('sMyStatus').className = 'status online';
                document.getElementById('sInfo').innerHTML = '✅ Подключено!';
            });
            outgoingCall.on('close', () => {
                document.getElementById('sRemoteVideo').srcObject = null;
                document.getElementById('sRemotePlace').style.display = 'flex';
                document.getElementById('sRemoteStatus').innerText = 'Отключён';
                document.getElementById('sRemoteStatus').className = 'status offline';
                document.getElementById('sInfo').innerHTML = '⚠️ Учитель отключился';
            });
            call = outgoingCall;
        });
        
        peer.on('call', (incomingCall) => {
            if (incomingCall.metadata?.type === 'screen') {
                incomingCall.answer();
                incomingCall.on('stream', (stream) => {
                    document.getElementById('sInfo').innerHTML = '🖥️ Учитель показывает экран';
                });
                screenCall = incomingCall;
            }
        });
    };
    
    // Ученик - камера/микрофон
    document.getElementById('sCamBtn').onclick = () => {
        if (localStream) {
            camOn = !camOn;
            localStream.getVideoTracks()[0].enabled = camOn;
            document.getElementById('sMyPlace').style.display = camOn ? 'none' : 'flex';
            document.getElementById('sCamBtn').innerHTML = camOn ? '📷 Выкл камеру' : '📷 Вкл камеру';
        }
    };
    
    document.getElementById('sMicBtn').onclick = () => {
        if (localStream) {
            micOn = !micOn;
            localStream.getAudioTracks()[0].enabled = micOn;
            document.getElementById('sMicBtn').innerHTML = micOn ? '🎤 Выкл микрофон' : '🎤 Вкл микрофон';
        }
    };
    
    window.onbeforeunload = () => {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (screenStream) screenStream.getTracks().forEach(t => t.stop());
        if (peer) peer.destroy();
    };
</script>
</body>
</html>
